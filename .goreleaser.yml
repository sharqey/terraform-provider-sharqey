# Konfiguracja GoReleaser wg konwencji HashiCorp dla providerów Terraform
# (https://developer.hashicorp.com/terraform/registry/providers/publishing).
# Na razie NIE jest jeszcze podpięta pod żaden CI — provider jest
# self-hosted (patrz README.md, sekcja "Build i instalacja lokalna"),
# rejestracja w publicznym Terraform Registry to przyszły krok (wymaga
# repo na GitHubie + klucza GPG zarejestrowanego w Registry). Konfiguracja
# jest przygotowana już teraz, żeby to przejście nie wymagało przepisywania
# pipeline'u — tylko podpięcia go pod CI i dodania sekretu GPG.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # Wymaga zaimportowanego klucza GPG (env GPG_FINGERPRINT) i hasła w
      # pliku GPG_PASSPHRASE_FILE (klucz ma hasło, więc pinentry loopback).
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-file"
      - "{{ .Env.GPG_PASSPHRASE_FILE }}"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  github:
    owner: sharqey
    name: terraform-provider-sharqey
  extra_files:
    - glob: "terraform-registry-manifest.json"
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
